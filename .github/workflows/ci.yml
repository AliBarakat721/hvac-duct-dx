name: HVAC Duct DX checks

on:
  push:
    branches: [main, "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install GUI and regression-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PySide6 numpy pandas openpyxl python-docx Pillow PyMuPDF pytesseract

      - name: Verify GUI test prerequisites
        run: |
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          test -f G01.RTF

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Run regression tests
        run: python -m pytest -q -rs
