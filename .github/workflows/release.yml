name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt build
      - name: Validate source
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q .
          python -m pytest -q
          ruff check .
      - name: Build source archive
        run: python -m build --sdist --wheel
      - name: Publish GitHub release
        if: vars.ALLOW_PUBLIC_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Explain why publishing was skipped
        if: vars.ALLOW_PUBLIC_RELEASE != 'true'
        run: echo "Release assets were built but not published. Set ALLOW_PUBLIC_RELEASE=true only after redistribution rights are confirmed."
